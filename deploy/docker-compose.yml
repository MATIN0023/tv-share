# MovieSync platform — local / staging stack
# Usage: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_ADDR: ":8090"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: watchparty
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ASSISTANT_SERVICE_URL: http://ai-assistant:8200
      AI_WORKER_URL: http://ai-worker:8100
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DEV_MODE: ${DEV_MODE:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ../services/ai-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      PORT: "8100"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
    volumes:
      - ai_worker_tmp:/tmp/ai-worker

  ai-assistant:
    build:
      context: ../services/ai-assistant
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      PORT: "8200"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  # Voice / WebRTC SFU placeholder — wire when voice chat ships (Phase 3)
  # livekit:
  #   image: livekit/livekit-server:latest
  #   ports:
  #     - "7880:7880"
  #     - "7881:7881"
  #   environment:
  #     LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8090}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8090/ws}
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  ai_worker_tmp:
